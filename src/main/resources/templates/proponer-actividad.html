<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Proponer Actividad — ODYSSEY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Jost:wght@500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/odyssey-travela.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16x16.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-touch-icon.png}">
</head>
<body class="odyssey-inner">
<div th:replace="~{fragments :: topbar}"></div>
<div th:replace="~{fragments :: navbar-interno}"></div>

<section class="editorial-subhero has-float-bar" style="--subhero-img: url('/img/pf-actividades.jpg');">
    <div class="editorial-subhero-bg"></div>
    <div class="container editorial-subhero-inner">
        <nav class="ed-breadcrumb" aria-label="breadcrumb">
            <a href="/" th:text="#{nav.inicio}">Inicio</a>
            <span class="sep">/</span>
            <a href="/actividades" th:text="#{nav.actividades}">Actividades</a>
            <span class="sep">/</span>
            <span class="current">Proponer actividad</span>
        </nav>
        <span class="eyebrow eyebrow-light"><i class="fas fa-compass"></i> Comunidad Odyssey</span>
        <h1>Proponer una <em>Actividad</em></h1>
        <p class="editorial-subhero-lead">Comparte un tour, experiencia cultural o aventura en Cartagena con la comunidad ODYSSEY</p>
    </div>
</section>

<main class="pb-5">
    <div class="container ed-float-wrap" style="max-width:740px;">
        <div class="ed-form-card">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <form th:action="@{/proponer-actividad}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label">Nombre de la actividad <span class="text-danger">*</span></label>
                    <input type="text" name="nombre" class="form-control"
                           placeholder="Ej: Tour en kayak por los manglares" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="4"
                              placeholder="Describe la actividad, qué incluye, puntos de interés..."></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Categoría <span class="text-danger">*</span></label>
                        <select name="categoria" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="TOUR">🗺️ Tour</option>
                            <option value="DEPORTE">🏄 Deporte</option>
                            <option value="CULTURA">🏛️ Cultura</option>
                            <option value="GASTRONOMIA">🍽️ Gastronomía</option>
                            <option value="NATURALEZA">🌿 Naturaleza</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Duración aproximada</label>
                        <input type="text" name="duracion" class="form-control"
                               placeholder="Ej: 3 horas, Medio día">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio aproximado</label>
                    <input type="text" name="precioAprox" class="form-control"
                           placeholder="Ej: $80.000 COP por persona, Gratis">
                </div>

                <div class="mb-4">
                    <label class="form-label">Imagen de la actividad (JPG/PNG, opcional)</label>
                    <input type="file" name="imagen" class="form-control" accept="image/jpeg,image/jpg,image/png">
                    <small class="text-muted">Máx. 2 MB.</small>
                </div>

                <button type="submit" class="button button-primary w-100">
                    <i class="fas fa-paper-plane"></i> Enviar propuesta
                </button>
            </form>

            <p class="text-muted small mt-3 mb-2 text-center">
                Tu propuesta será revisada por el equipo ODYSSEY antes de publicarse.
            </p>
            <div class="text-center">
                <a href="/actividades" class="text-link small">
                    <i class="fas fa-arrow-left"></i> Volver a actividades
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-interno}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
