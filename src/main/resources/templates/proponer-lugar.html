<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Proponer Lugar — ODYSSEY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Jost:wght@500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/odyssey-travela.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16x16.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-touch-icon.png}">
</head>
<body class="odyssey-inner">
<div th:replace="~{fragments :: topbar}"></div>
<div th:replace="~{fragments :: navbar-interno}"></div>

<section class="editorial-subhero has-float-bar" style="--subhero-img: url('/img/pf-proponer-lugar.jpg');">
    <div class="editorial-subhero-bg"></div>
    <div class="container editorial-subhero-inner">
        <nav class="ed-breadcrumb" aria-label="breadcrumb">
            <a href="/" th:text="#{nav.inicio}">Inicio</a>
            <span class="sep">/</span>
            <a href="/lugares?categoriaId=0" th:text="#{lugares.breadcrumb}">Lugares</a>
            <span class="sep">/</span>
            <span class="current">Proponer lugar</span>
        </nav>
        <span class="eyebrow eyebrow-light"><i class="fas fa-map-pin"></i> Comunidad Odyssey</span>
        <h1>Proponer un <em>Lugar</em></h1>
        <p class="editorial-subhero-lead">Comparte un sitio turístico de Cartagena con la comunidad viajera</p>
    </div>
</section>

<main class="pb-5">
    <div class="container ed-float-wrap" style="max-width:740px;">
        <div class="ed-form-card">
            <div class="alerta-error" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
            <form th:action="@{/proponer-lugar}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label class="form-label">Nombre del lugar <span class="text-danger">*</span></label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Playa La Bocana" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Describe brevemente el lugar..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ubicación <span class="text-danger">*</span></label>
                    <input type="text" name="ubicacion" class="form-control" placeholder="Ej: Barrio El Laguito, Cartagena" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoriaId" class="form-select">
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}">Cat</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">URL del mapa (opcional)</label>
                    <input type="text" name="urlMapa" class="form-control" placeholder="https://maps.google.com/...">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Latitud (opcional)</label>
                        <input type="number" step="any" name="latitud" class="form-control" placeholder="Ej: 10.4236">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Longitud (opcional)</label>
                        <input type="number" step="any" name="longitud" class="form-control" placeholder="Ej: -75.5489">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Imagen del lugar (opcional, máx. 2 MB)</label>
                    <input type="file" name="imagen" class="form-control" accept="image/*">
                </div>
                <button type="submit" class="button button-primary w-100">
                    <i class="fas fa-paper-plane"></i> Enviar propuesta
                </button>
            </form>
            <p class="text-muted small mt-3 mb-2 text-center">Tu propuesta será revisada por el equipo ODYSSEY antes de publicarse.</p>
            <div class="text-center">
                <a href="/lugares?categoriaId=0" class="text-link small"><i class="fas fa-arrow-left"></i> Volver a lugares</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-interno}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
