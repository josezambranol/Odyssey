<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Página no encontrada — ODYSSEY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/odyssey-travela.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
</head>
<body style="background:var(--cream); min-height:100vh; display:flex; flex-direction:column;">

<div th:replace="fragments :: topbar"></div>
<div th:replace="fragments :: navbar-interno"></div>

<div class="container py-5 my-auto text-center" style="max-width:620px;">
    <div class="bg-white rounded-3 shadow-sm p-5 border" style="border-color:rgba(200,150,62,.3) !important;">
        <div style="font-size: 4rem; color:var(--gold); margin-bottom: 1rem;">
            <i class="fa fa-compass fa-spin" style="--fa-animation-duration: 15s;"></i>
        </div>
        <h2 class="fw-bold mb-3" style="font-family:'Cormorant Garamond',serif; color:var(--azul); font-size:2.2rem;">
            Rumbo Inesperado
        </h2>
        <p class="text-muted mb-4 lh-lg">
            La página o acción que buscas no está disponible o ha ocurrido una desviación en la ruta. No te preocupes, puedes volver al mapa principal de Cartagena.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="/" class="btn btn-primary rounded-pill px-4 py-2">
                <i class="fa fa-home me-2"></i>Ir al Inicio
            </a>
            <a href="/guia" class="btn btn-outline-primary rounded-pill px-4 py-2">
                <i class="fa fa-map-marked-alt me-2"></i>Ver Guía
            </a>
        </div>
    </div>
</div>

<div th:replace="fragments :: footer-interno" class="mt-auto"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
