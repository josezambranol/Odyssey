<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Página no encontrada — ODYSSEY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Jost:wght@500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/odyssey-travela.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
</head>
<body class="odyssey-inner" style="min-height:100vh; display:flex; flex-direction:column;">

<div th:replace="~{fragments :: topbar}"></div>
<div th:replace="~{fragments :: navbar-interno}"></div>

<main class="container py-5 my-auto" style="max-width:660px;">
    <div class="ed-form-card text-center">
        <div class="home-brand-mark mx-auto mb-4" style="width:68px; height:68px; font-size:1.75rem;">
            <i class="fas fa-compass fa-spin" style="--fa-animation-duration: 16s;"></i>
        </div>
        <span class="eyebrow justify-content-center mb-2">ODYSSEY · CARTAGENA</span>
        <h1 class="mb-3" style="color:var(--azul-dark); font-size:clamp(1.9rem, 4vw, 2.5rem);">Rumbo <em>Inesperado</em></h1>
        <p class="mb-4" style="color:#66645f; line-height:1.7;">
            La página o acción que buscas no está disponible o ha ocurrido una desviación en la ruta. No te preocupes, puedes volver a la portada o consultar la guía de Cartagena.
        </p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="/" class="button button-primary">
                <i class="fas fa-home"></i> Ir al Inicio
            </a>
            <a href="/guia" class="button button-gold">
                <i class="fas fa-book-open"></i> Ver Guía
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-interno}" class="mt-auto"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
