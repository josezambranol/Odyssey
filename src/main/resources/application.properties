spring.application.name=odyssey

# ── Importar configuración local privada si existe (ignorado en git) ──
spring.config.import=optional:classpath:application-local.properties

# ── 🚀 Java 21 Project Loom — Virtual Threads (Concurrencia Ligera I/O) ──
spring.threads.virtual.enabled=true

# ── 📊 Observabilidad Cloud-Native (Actuator + Micrometer Prometheus) ──
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ── 🐬 Conexión a MySQL / MariaDB (RDBMS / JPA) ──────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Configuración de Caché en Memoria (Spring Cache) ──────────────
spring.cache.type=simple

# ── 📚 Swagger / OpenAPI 3.0 Documentation ────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ── Tamaño máximo y ruta persistente de archivos subidos ─────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
odyssey.upload.dir=${ODYSSEY_UPLOAD_DIR:${user.home}/odyssey-uploads}

# ── Puerto del Servidor y Compresión HTTP ────────────────────────
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

# ── i18n ─────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# ── Chatbot ODYSSEY — Google Gemini ───────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}

# ── 📧 Configuración SMTP (Gmail / Correo para Códigos OTP y Alertas) ─
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
