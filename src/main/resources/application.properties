spring.application.name=odyxs

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Evitar warning de open-in-view
spring.jpa.open-in-view=false

# Tamano maximo de archivo subido
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# ── Chatbot ODYX — Google Gemini (GRATIS) ──────────────────
# Obtén tu key gratis en: https://aistudio.google.com/app/apikey
# 1. Inicia sesión con tu cuenta Google
# 2. Clic en "Create API key" y copia la key
# 3. Pégala aquí (o usa la variable de entorno GEMINI_API_KEY en tu .env):
gemini.api.key=${GEMINI_API_KEY:}
