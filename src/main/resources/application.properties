spring.application.name=odyxs

# ── Conexión a MySQL / MariaDB ─────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Tamaño máximo de archivo subido ────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Puerto del Servidor ────────────────────────────────────
server.port=${PORT:8080}

# ── i18n ───────────────────────────────────────────────────
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# ── Chatbot ODYX — Google Gemini ───────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
