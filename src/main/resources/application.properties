spring.application.name=odyssey

# ── Importar configuración local privada si existe (ignorado en git) ──
spring.config.import=optional:classpath:application-local.properties

# ── 🐬 Conexión a MySQL / MariaDB (RDBMS / JPA) ──────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── 🍃 Conexión a MongoDB (NoSQL / +15,000 Reportes y Telemetría) ─
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/odyssey_nosql}
spring.data.mongodb.auto-index-creation=true

# ── ⚡ Conexión a Redis (In-Memory Cache & Key-Value) ─────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ── Configuración de Caché (Redis / In-Memory) ────────────────────
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ── 📚 Swagger / OpenAPI 3.0 Documentation ────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ── Tamaño máximo de archivo subido ──────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Puerto del Servidor ──────────────────────────────────────────
server.port=${PORT:8080}

# ── i18n ─────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# ── Chatbot ODYSSEY — Google Gemini ───────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
spring.data.redis.repositories.enabled=false

# ── 📧 Configuración SMTP (Gmail / Correo para Códigos OTP y Alertas) ─
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
