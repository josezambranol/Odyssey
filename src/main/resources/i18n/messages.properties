trans.c1.li1=<strong>Línea T102:</strong> Aeropuerto ↔ Centro Histórico.
trans.c1.li2=<strong>Línea T103:</strong> Portal ↔ Bocagrande (hoteles).
trans.c1.li3=<strong>Pago:</strong> Tarjeta recargable ($6.000 COP tarjeta plástica).
trans.c1.cost=💰 $3.000 COP por viaje
trans.c2.badge=Servicio Público
trans.c2.title=Taxis Amarillos DATT
trans.c2.desc=Disponibles en toda la ciudad. En el aeropuerto debes pasar por la caseta oficial de taxis donde te entregan un tiquete impreso con la tarifa exacta hacia tu hotel.
trans.c2.li1=<strong>Aeropuerto → Centro:</strong> ~$15.000 - $18.000 COP.
trans.c2.li2=<strong>Aeropuerto → Bocagrande:</strong> ~$22.000 - $25.000 COP.
trans.c2.li3=<strong>Regla de oro:</strong> Confirma el precio antes de subir la maleta.
