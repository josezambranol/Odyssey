trans.c3.badge=Transporte Marítimo
trans.c3.title=Lanchas a Islas y Barú
trans.c3.desc=Las salidas oficiales hacia el Parque Nacional Islas del Rosario y Playa Blanca parten exclusivamente del <strong>Muelle de la Bodeguita</strong>.
trans.c3.li1=<strong>Zarpe:</strong> Entre 8:30 AM y 9:30 AM.
