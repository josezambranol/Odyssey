trans.datt.title=¡Muy Importante! En Cartagena los taxis NO usan taxímetro
trans.datt.body=A diferencia de Bogotá o Medellín, <strong>ningún taxi en Cartagena cuenta con taxímetro legal</strong>. Todas las tarifas están fijadas por <strong>decreto del Departamento Administrativo de Tránsito y Transporte (DATT)</strong> según zonas. Todo taxista está legalmente obligado a portar la <strong>Tarjeta de Control plastificada</strong> detrás del asiento del copiloto con las tarifas oficiales impresas.
trans.datt.min=Tarifa Mínima Legal: ~$10.000 COP
