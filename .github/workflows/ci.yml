name: Odyssey CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret & API Key Leak Guard
        run: |
          if git ls-files --error-unmatch .env src/main/resources/application-local.properties >/dev/null 2>&1; then
            echo "ERROR: Private local config detected in Git."
            exit 1
          fi
          if grep -RIn "AIzaSy[A-Za-z0-9_-]\{30,\}" src/ pom.xml Dockerfile docker-compose.yml; then
            echo "ERROR: Exposed Google API Key detected."
            exit 1
          fi

      - name: Set up JDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Test Suite & JaCoCo Coverage
        run: mvn -B test

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Verify Multi-Stage Docker Image Build
        run: docker build -t odyssey:5.0.0 .
