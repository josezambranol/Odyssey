name: Odyssey CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret & API Key Leak Guard
        run: |
          if git ls-files --error-unmatch .env src/main/resources/application-local.properties >/dev/null 2>&1; then
            echo "ERROR: Private local config detected in Git."
            exit 1
          fi
          if grep -RIn "AIzaSy[A-Za-z0-9_-]\{30,\}" src/ pom.xml Dockerfile docker-compose.yml; then
            echo "ERROR: Exposed Google API Key detected."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        run: mvn -B test
