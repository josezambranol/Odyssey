services:
  # Base de datos Relacional única: MySQL 8
  mysql:
    image: mysql:8.0
    container_name: odyssey_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: odyxsvg_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/odyxsvg_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - odyssey_network

  # Aplicación Odyssey (Spring Boot 3.2.5 + Java 21)
  odyssey-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: odyssey:latest
    container_name: odyssey_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ODYSSEY_UPLOAD_DIR=/app/uploads
      - PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
    networks:
      - odyssey_network

networks:
  odyssey_network:
    driver: bridge

volumes:
  mysql_data:
  app_uploads:
