version: '3.8'

services:
  # 🐬 Base de datos Relacional: MySQL 8 (ACID, Usuarios, Catálogo)
  mysql:
    image: mysql:8.0
    container_name: odyssey_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: odyxsvg_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/odyxsvg_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - odyssey_network

  # 🍃 Base de datos Documental NoSQL: MongoDB 7 (+15,000 Reportes y Telemetría)
  mongodb:
    image: mongo:7.0
    container_name: odyssey_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - odyssey_network

  # ⚡ Almacén en Memoria / Caché: Redis 7
  redis:
    image: redis:7.2-alpine
    container_name: odyssey_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - odyssey_network

  # 🚀 Aplicación Odyssey (Spring Boot 3.2.5 + Java 21)
  odyssey-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: odyssey:latest
    container_name: odyssey_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - MONGO_URI=mongodb://mongodb:27017/odyssey_nosql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
    networks:
      - odyssey_network

  # 🖥️ GUI para MongoDB: Mongo Express
  mongo-express:
    image: mongo-express:latest
    container_name: odyssey_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - odyssey_network

  # 🖥️ GUI para Redis: Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: odyssey_redis_commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - odyssey_network

networks:
  odyssey_network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  app_uploads:
